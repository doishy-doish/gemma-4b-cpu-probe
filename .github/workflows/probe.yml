name: 4b-cpu-probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  e4b-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q six kaggle llama-cpp-python huggingface_hub
      - run: |
          kaggle models instances -h 2>&1 | tee dl0.txt | head -30
          kaggle models instances download -m ssfdre38/gemma4-turbo-e4b -p e4b 2>&1 | tee -a dl0.txt | tail -5
          ls -la e4b/ 2>&1 | tee -a dl0.txt
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - run: |
          cat > smoke.py <<'PYEOF'
          import time, glob
          from llama_cpp import Llama
          fs = glob.glob("e4b/*.gguf") + glob.glob("e4b/**/*.gguf")
          print("GGUF_FILES", fs, flush=True)
          llm = Llama(model_path=fs[0], n_ctx=4096, verbose=False)
          print("LOADED", fs[0], flush=True)
          p1 = "You are an autonomous software engineer. Issue: chunked() in more_itertools. Reply with the single most likely source file path, nothing else."
          t2 = time.time()
          o1 = llm.create_chat_completion(messages=[{"role": "user", "content": p1}], max_tokens=64, temperature=0.0)
          t3 = time.time()
          print("GEN1_S", round(t3 - t2, 1), flush=True)
          print("REPLY1:", o1["choices"][0]["message"]["content"][:200], flush=True)
          PYEOF
          python3 smoke.py 2>&1 | tee smoke-out.txt | tail -10
          mkdir -p results
          { echo "# e4b-gguf"; echo "~~~"; cat dl0.txt smoke-out.txt; echo "~~~"; } > results/e4b-gguf.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/e4b-gguf.md && git commit -m "e4b-gguf v6 results" && git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  loras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q six kaggle
      - run: |
          kaggle models list -s swe-agent-lora 2>&1 | tee cli.txt | head -12
          kaggle models list -s loop-breaker 2>&1 | tee -a cli.txt | head -12
          for m in omallo/gemma4-e4b-swe-agent-lora-from-31b robinamirbahar/gemma-4-31b-loop-breaker-lora robinamirbahar/gemma-4-ccr-loop-breaker; do
            echo "=== $m ===" | tee -a cli.txt
            kaggle models instances download -m $m -p lora-$RANDOM 2>&1 | tee -a cli.txt | tail -3
          done
          ls -laR lora-* 2>/dev/null | tee -a cli.txt | head -40
          find lora-* -name "*.json" 2>/dev/null | head -8 | xargs -I{} sh -c 'echo "=== {} ==="; cat {}' 2>&1 | tee -a cli.txt | head -80
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - run: |
          mkdir -p results
          { echo "# loras"; echo "~~~"; cat cli.txt; echo "~~~"; } > results/loras.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/loras.md && git commit -m "loras results" && git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
