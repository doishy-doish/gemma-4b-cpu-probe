name: 4b-cpu-probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  e4b-gguf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q llama-cpp-python huggingface_hub
      - run: |
          kaggle models download -m ssfdre38/gemma4-turbo-e4b -p e4b 2>&1 | tee dl1.txt | tail -5
          ls -la e4b/ 2>&1 | tee -a dl1.txt
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - run: |
          cat > smoke.py <<'PYEOF'
          import time, glob
          from llama_cpp import Llama
          fs = glob.glob("e4b/*.gguf") + glob.glob("e4b/**/*.gguf")
          print("GGUF_FILES", fs, flush=True)
          llm = Llama(model_path=fs[0], n_ctx=4096, verbose=False)
          print("LOADED", fs[0], flush=True)
          p1 = "You are an autonomous software engineer. Issue: chunked() in more_itertools. Reply with the single most likely source file path, nothing else."
          t2 = time.time()
          o1 = llm.create_chat_completion(messages=[{"role": "user", "content": p1}], max_tokens=64, temperature=0.0)
          t3 = time.time()
          c1 = o1["choices"][0]["message"]["content"]
          print("GEN1_S", round(t3 - t2, 1), "CHARS", len(c1), flush=True)
          print("REPLY1-BEGIN")
          print(c1)
          print("REPLY1-END", flush=True)
          PYEOF
          python3 smoke.py 2>&1 | tee smoke-out.txt | tail -10
          mkdir -p results
          { echo "# e4b-gguf"; echo "~~~"; cat dl1.txt smoke-out.txt; echo "~~~"; } > results/e4b-gguf.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/e4b-gguf.md && git commit -m "e4b-gguf results" && git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  omallo-lora:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q six kaggle
      - run: |
          kaggle models list -s swe-agent-lora 2>&1 | tee cli-lora.txt | head -20
          kaggle models download -m omallo/gemma4-e4b-swe-agent-lora-from-31b -p lora 2>&1 | tee -a cli-lora.txt | tail -5
          ls -laR lora/ 2>&1 | tee -a cli-lora.txt | head -30
          find lora/ -name "*.json" | head -5 | xargs -I{} sh -c 'echo "=== {} ==="; cat {}' 2>&1 | tee -a cli-lora.txt | head -60
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - run: |
          mkdir -p results
          { echo "# omallo-lora"; echo "~~~"; cat cli-lora.txt; echo "~~~"; } > results/omallo-lora.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/omallo-lora.md && git commit -m "omallo-lora results" && git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
