name: 4b-cpu-probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  smoke-4b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q llama-cpp-python huggingface_hub
      - run: |
          cat > smoke.py <<'PYEOF'
          import time
          from llama_cpp import Llama
          t0 = time.time()
          llm = Llama.from_pretrained(repo_id="Qwen/Qwen3-4B-GGUF", filename="Qwen3-4B-Q4_K_M.gguf", n_ctx=2048, verbose=False)
          t1 = time.time()
          t2 = time.time()
          out = llm.create_chat_completion(messages=[{"role": "user", "content": "You are an autonomous software engineer. Issue: chunked() in more_itertools/more.py mangles docstrings. Reply with the single most likely source file path, nothing else."}], max_tokens=64, temperature=0.0)
          t3 = time.time()
          print("LOAD_S", round(t1 - t0, 1))
          print("GEN_S", round(t3 - t2, 1))
          print("REPLY:", out["choices"][0]["message"]["content"][:300])
          PYEOF
          python3 smoke.py 2>&1 | tee smoke-out.txt | tail -12
          mkdir -p results
          { echo "# smoke-4b $(date -u +%FT%TZ)"; grep -E "LOAD_S|GEN_S|REPLY" smoke-out.txt; } > results/smoke-4b.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/smoke-4b.md && git commit -m "smoke-4b results" && git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e4b-recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q six kaggle requests
      - run: |
          cat > recon.py <<'PYEOF'
          import os, json, requests
          from requests.auth import HTTPBasicAuth
          A = HTTPBasicAuth(os.environ["KAGGLE_USERNAME"], os.environ["KAGGLE_KEY"])
          def get(u):
              r = requests.get(u, auth=A, allow_redirects=True, timeout=120)
              print(u, "->", r.status_code, len(r.content))
              return r
          r = get("https://api.kaggle.com/api/v1/models/google/gemma-4/get")
          try:
              j = r.json()
              print("TITLE:", j.get("title"))
              print(json.dumps(j, indent=1)[:2500])
          except Exception as ex:
              print("META_JSON_FAIL", str(ex)[:120])
              print(r.text[:300])
          PYEOF
          python3 recon.py 2>&1 | tee recon-out.txt | tail -45
          mkdir -p results
          { echo "# e4b-recon $(date -u +%FT%TZ)"; cat recon-out.txt; } > results/e4b-recon.md
          git config user.name "probe-bot" && git config user.email "probe-bot@local"
          git pull --rebase origin main 2>/dev/null || true
          git add results/e4b-recon.md && git commit -m "e4b-recon results" && git push origin HEAD:main
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
